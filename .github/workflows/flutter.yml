name: flutter app CI/CD

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - main

jobs:
  check_and_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v3
        with:
            distribution: 'zulu'
            java-version: "12.x"
            cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk

